# System Protection Hardening
# Applied via: sudo sysctl -p /etc/sysctl.d/99-protection.conf

# === OOM Safety ===
# Kill the allocating process, not random victims
vm.oom_kill_allocating_task = 1
vm.panic_on_oom = 0

# Refuse allocations when memory is critically low
vm.overcommit_memory = 2
vm.overcommit_ratio = 80

# Reserve 256MB for kernel/DMA (prevents deadlock under pressure)
vm.min_free_kbytes = 262144

# Keep swap as emergency fallback, not working memory
vm.swappiness = 10

# === Fork Bomb Protection ===
kernel.pid_max = 65536

# === Kernel Hardening ===
# Disable SysRq (prevents remote reboot via magic keys)
kernel.sysrq = 0

# Restrict dmesg to root
kernel.dmesg_restrict = 1

# Restrict kernel pointer leaks
kernel.kptr_restrict = 2

# === Network Hardening ===
# Reverse path filtering (prevents IP spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Disable ICMP redirects (prevents MITM)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Disable source routing (prevents spoofing)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Ignore broadcast pings (smurf attack prevention)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Log suspicious packets
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
