[OOM]
# Kill processes when swap is 80% used (default 90%)
SwapUsedLimit=80%

# Kill cgroups using >50% memory pressure (default 60%)
# Lower = more aggressive, catches runaway processes sooner
DefaultMemoryPressureLimit=50%

# Sustained pressure for 15s triggers kill (default 30s)
DefaultMemoryPressureDurationSec=15s

# Kill cgroups using >70% IO pressure
DefaultIOPressureLimit=70%
DefaultIOPressureDurationSec=30s
