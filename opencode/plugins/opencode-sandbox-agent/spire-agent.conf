agent {
  data_dir = "/opt/spire"
  log_level = "warn"
  server_address = "host.docker.internal"
  server_port = 8081
  socket_path = "/tmp/spire/sockets/agent.sock"
  trust_domain = "local"
}

health_check {
  listener_enabled = true
  bind_address = "0.0.0.0"
  bind_port = "8080"
  live_path = "/live"
  ready_path = "/ready"
}
