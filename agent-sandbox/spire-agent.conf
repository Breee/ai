agent {
  data_dir = "/opt/spire"
  log_level = "info"
  server_address = "127.0.0.1"
  server_port = 8081
  socket_path = "/tmp/spire/sockets/agent.sock"
  trust_domain = "local"
  trust_bundle_path = "/etc/spire/bundle.crt"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            directory = "/opt/spire"
        }
    }

    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
